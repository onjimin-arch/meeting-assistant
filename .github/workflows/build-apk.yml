name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Flutter Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Android SDK / NDK info
        run: |
          echo "=== Android SDK platforms ==="
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "(none)"
          echo "=== Flutter version ==="
          flutter --version

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Patch plugin compileSdk
        run: |
          find "$HOME/.pub-cache" -name "build.gradle" | while read f; do
            if grep -q 'compileSdk' "$f"; then
              sed -i 's/compileSdk [0-9]*/compileSdk 35/' "$f"
            fi
          done

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze (non-blocking)
        run: flutter analyze --no-fatal-infos || true

      - name: Build Debug APK
        id: build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_SECRET_API }}
        run: |
          set -o pipefail
          flutter build apk --debug --dart-define=NOTION_TOKEN=$NOTION_TOKEN 2>&1 | tee build_output.txt
          ls build/app/outputs/flutter-apk/

      # ── 성공 시 ────────────────────────────────────────────────────────────

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: meeting-assistant-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Slack — 빌드 성공
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUM: ${{ github.run_number }}
          RELEASES_URL: https://github.com/onjimin-arch/meeting-assistant/releases
        run: |
          PAYLOAD=$(jq -n \
            --arg run_num "$RUN_NUM" \
            --arg branch "$BRANCH" \
            --arg commit "${COMMIT_MSG:-PR/수동}" \
            --arg url "$RELEASES_URL" \
            '{text:(":white_check_mark: *Meeting Assistant 빌드 성공* (#"+$run_num+")"),
              attachments:[{color:"#36a64f",fields:[
                {title:"브랜치",value:$branch,short:true},
                {title:"커밋",value:$commit,short:false},
                {title:"APK 다운로드",value:("<"+$url+"|Releases에서 다운로드>"),short:false}
              ]}]}')
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' -d "$PAYLOAD"

      # ── 실패 시 ────────────────────────────────────────────────────────────

      - name: Capture error tail
        if: failure() && steps.build.outcome == 'failure'
        run: tail -100 build_output.txt > error_tail.txt 2>/dev/null || echo "로그 없음" > error_tail.txt

      - name: Print error tail to log
        if: failure() && steps.build.outcome == 'failure'
        run: |
          echo "===== BUILD ERROR TAIL ====="
          cat error_tail.txt 2>/dev/null || echo "로그 없음"
          echo "============================="

      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-logs-${{ github.run_number }}
          path: |
            build_output.txt
            error_tail.txt
          retention-days: 7

      # ── Claude 자동 수정 (auto-fix 커밋이 아닐 때만) ─────────────────────

      - name: Claude 자동 수정
        if: |
          failure() &&
          steps.build.outcome == 'failure' &&
          secrets.OPENAI_API_KEY != '' &&
          !contains(github.event.head_commit.message, '[auto-fix]')
        id: autofix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pip install openai --quiet 2>/dev/null
          if python3 .github/scripts/claude_autofix.py; then
            echo "fixed=true" >> $GITHUB_OUTPUT
          else
            echo "fixed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit & 재배포 트리거
        if: failure() && steps.autofix.outputs.fixed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add android/
          if ! git diff --staged --quiet; then
            git commit -m "[auto-fix] CI #${{ github.run_number }}: Claude 자동 빌드 에러 수정"
            git push
            echo "Auto-fix committed. Dispatching new build..."
            gh workflow run build-apk.yml --ref "${{ github.ref_name }}"
          else
            echo "No staged changes after auto-fix."
          fi

      - name: Slack — 자동 수정 시도 알림
        if: failure() && steps.autofix.outputs.fixed == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_NUM: ${{ github.run_number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD=$(jq -n \
            --arg run_num "$RUN_NUM" \
            --arg url "$RUN_URL" \
            '{text:(":wrench: *Meeting Assistant 자동 수정 시도* (#"+$run_num+")"),
              attachments:[{color:"#f0a500",fields:[
                {title:"상태",value:"Claude가 에러를 분석하고 수정을 적용했습니다. 새 빌드가 시작됩니다.",short:false},
                {title:"로그",value:("<"+$url+"|Actions에서 보기>"),short:false}
              ]}]}')
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' -d "$PAYLOAD"

      # ── 최종 실패 알림 (auto-fix 커밋이거나 auto-fix 불가) ───────────────

      - name: Read error tail for Slack
        if: |
          failure() &&
          (contains(github.event.head_commit.message, '[auto-fix]') ||
           steps.autofix.outputs.fixed == 'false' ||
           secrets.OPENAI_API_KEY == '')
        id: errlog
        run: |
          MSG=$(tail -40 error_tail.txt 2>/dev/null | tr '\n' ' ' | sed 's/"/\\"/g' || echo "로그 없음")
          echo "msg=$MSG" >> $GITHUB_OUTPUT

      - name: Slack — 빌드 실패
        if: |
          failure() &&
          (contains(github.event.head_commit.message, '[auto-fix]') ||
           steps.autofix.outputs.fixed == 'false' ||
           secrets.OPENAI_API_KEY == '')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUM: ${{ github.run_number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ERR_MSG: ${{ steps.errlog.outputs.msg }}
        run: |
          PAYLOAD=$(jq -n \
            --arg run_num "$RUN_NUM" \
            --arg branch "$BRANCH" \
            --arg commit "${COMMIT_MSG:-PR/수동}" \
            --arg err "${ERR_MSG:-에러 로그 없음}" \
            --arg url "$RUN_URL" \
            '{text:(":x: *Meeting Assistant 빌드 실패* (#"+$run_num+")"),
              attachments:[{color:"#e01e5a",fields:[
                {title:"브랜치",value:$branch,short:true},
                {title:"커밋",value:$commit,short:false},
                {title:"에러 요약",value:$err,short:false},
                {title:"전체 로그",value:("<"+$url+"|GitHub Actions에서 보기>"),short:false}
              ]}]}')
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' -d "$PAYLOAD"
