name: Build Android APK (CI)

run-name: "CI #${{ github.run_number }} (${{ github.ref_name }}) — ${{ github.event.head_commit.message || 'manual' }}"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch pub-cache plugin compileSdk
        run: |
          set +o pipefail
          flutter pub get
          find "$HOME/.pub-cache/hosted" -path "*/android/build.gradle*" 2>/dev/null | while read f; do
            sed -i -E 's#compileSdk[[:space:]]*=[[:space:]]*[0-9]+#compileSdk = 36#g' "$f" 2>/dev/null || true
            sed -i -E 's#compileSdkVersion[[:space:]]+[0-9]+#compileSdkVersion 36#g' "$f" 2>/dev/null || true
          done

      - name: Analyze
        run: flutter analyze || true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meeting-assistant-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
