name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Flutter Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Patch plugin compileSdk
        run: |
          find "$HOME/.pub-cache" -name "build.gradle" | while read f; do
            if grep -q 'compileSdk' "$f"; then
              sed -i 's/compileSdk [0-9]*/compileSdk 36/' "$f"
            fi
          done

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze (non-blocking)
        run: flutter analyze --no-fatal-infos || true

      - name: Build Debug APK
        id: build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_SECRET_API }}
        run: |
          set -o pipefail
          flutter build apk --debug --dart-define=NOTION_TOKEN=$NOTION_TOKEN 2>&1 | tee build_output.txt
          ls build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: meeting-assistant-debug-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Slack — 빌드 성공
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUM: ${{ github.run_number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASES_URL: https://github.com/onjimin-arch/meeting-assistant/releases
        run: |
          PAYLOAD=$(jq -n \
            --arg run_num "$RUN_NUM" \
            --arg branch "$BRANCH" \
            --arg commit "${COMMIT_MSG:-PR/수동}" \
            --arg url "$RELEASES_URL" \
            '{text:(":white_check_mark: *Meeting Assistant 빌드 성공* (#"+$run_num+")"),
              attachments:[{color:"#36a64f",fields:[
                {title:"브랜치",value:$branch,short:true},
                {title:"커밋",value:$commit,short:false},
                {title:"APK 다운로드",value:("<"+$url+"|Releases에서 다운로드>"),short:false}
              ]}]}')
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' -d "$PAYLOAD"

      - name: Capture error tail
        if: failure() && steps.build.outcome == 'failure'
        run: tail -80 build_output.txt > error_tail.txt 2>/dev/null || echo "로그 없음" > error_tail.txt

      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-logs-${{ github.run_number }}
          path: |
            build_output.txt
            error_tail.txt
          retention-days: 7

      - name: Read error tail for Slack
        if: failure()
        id: errlog
        run: |
          MSG=$(tail -20 error_tail.txt 2>/dev/null | tr '\n' ' ' | sed 's/"/\\"/g' || echo "로그 없음")
          echo "msg=$MSG" >> $GITHUB_OUTPUT

      - name: Slack — 빌드 실패
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUM: ${{ github.run_number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ERR_MSG: ${{ steps.errlog.outputs.msg }}
        run: |
          PAYLOAD=$(jq -n \
            --arg run_num "$RUN_NUM" \
            --arg branch "$BRANCH" \
            --arg commit "${COMMIT_MSG:-PR/수동}" \
            --arg err "${ERR_MSG:-에러 로그 없음}" \
            --arg url "$RUN_URL" \
            '{text:(":x: *Meeting Assistant 빌드 실패* (#"+$run_num+")"),
              attachments:[{color:"#e01e5a",fields:[
                {title:"브랜치",value:$branch,short:true},
                {title:"커밋",value:$commit,short:false},
                {title:"에러 요약",value:$err,short:false},
                {title:"전체 로그",value:("<"+$url+"|GitHub Actions에서 보기>"),short:false}
              ]}]}')
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' -d "$PAYLOAD"
