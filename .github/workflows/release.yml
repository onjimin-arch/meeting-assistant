name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/meeting-assistant.jks

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
storePassword=$STORE_PASSWORD
keyPassword=$KEY_PASSWORD
keyAlias=$KEY_ALIAS
storeFile=meeting-assistant.jks
EOF

      - name: Accept Android SDK licenses & install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;30.0.14904198" > /dev/null 2>&1 || true

      - name: Patch pub-cache plugin compileSdk
        run: |
          set +o pipefail
          flutter pub get
          find "$HOME/.pub-cache/hosted" -path "*/android/build.gradle*" 2>/dev/null | while read f; do
            sed -i -E 's#compileSdk[[:space:]]*=[[:space:]]*[0-9]+#compileSdk = 36#g' "$f" 2>/dev/null || true
            sed -i -E 's#compileSdkVersion[[:space:]]+[0-9]+#compileSdkVersion 36#g' "$f" 2>/dev/null || true
          done

      - name: Build release APK (universal)
        run: flutter build apk --release

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Determine tag name
        id: tag
        run: |
          echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "Meeting Assistant ${{ steps.tag.outputs.name }}"
          body: |
            ## Meeting Assistant ${{ steps.tag.outputs.name }}

            ### 설치 방법
            1. 아래 APK 중 하나를 다운로드
            2. Android 기기에서 `설정 → 보안 → 알 수 없는 소스` 허용
            3. APK 파일 실행해서 설치

            ### APK 종류
            - `app-release.apk` — 범용 (모든 기기)
            - `app-arm64-v8a-release.apk` — 64 비트 ARM (최신 기기, 권장)
            - `app-armeabi-v7a-release.apk` — 32 비트 ARM (구형 기기)
            - `app-x86_64-release.apk` — x86 에뮬레이터용

            ### 요구사항
            - Android 7.0 (API 24) 이상
            - 저장공간 약 700MB (Gemma 모델 다운로드 포함)
          files: build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false

      - name: Send Slack Notification (on success)
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: '{
            "text": "🚀 새로운 버전이 배포되었습니다!\n\n*버전:* ${{ steps.tag.outputs.name }}\n*다운로드:* ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.name }}\n\n📥 *APK 다운로드:*\n- ARM64 (권장): ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/app-arm64-v8a-release.apk\n- 범용: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/app-release.apk"
          }'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send Slack Notification (on failure)
        if: failure()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: '{
            "text": "❌ 빌드/배포가 실패했습니다.\n\n*버전:* ${{ steps.tag.outputs.name }}\n*확인:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
