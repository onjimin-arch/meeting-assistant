name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter clean
        run: flutter clean && flutter pub get

      - name: Build Release APK
        id: build
        run: flutter build apk --release 2>&1 | tee build_output.txt

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Meeting Assistant ${{ steps.tag.outputs.tag }}"
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## Meeting Assistant ${{ steps.tag.outputs.tag }}

            ### 설치 방법
            1. `app-release.apk` 다운로드
            2. 폰에 파일 전송 (구글드라이브, 카톡 등)
            3. "알 수 없는 출처 앱 허용" 후 설치

            **최소 요구 사항**: Android 7.0 (API 24) 이상
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Slack — 릴리즈 성공
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          PAYLOAD=$(jq -n \
            --arg tag "$TAG" \
            --arg url "https://github.com/${REPO}/releases/tag/${TAG}" \
            '{text:(":rocket: *Meeting Assistant "+$tag+" 릴리즈 완료!*"),
              attachments:[{color:"#36a64f",fields:[
                {title:"버전",value:$tag,short:true},
                {title:"APK 다운로드",value:("<"+$url+"|GitHub Releases>"),short:false}
              ]}]}')
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' -d "$PAYLOAD"

      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-error-logs-${{ github.run_number }}
          path: build_output.txt
          retention-days: 7

      - name: Read error tail for Slack
        if: failure()
        id: errlog
        run: |
          MSG=$(tail -20 build_output.txt 2>/dev/null | tr '\n' ' ' | sed 's/"/\\"/g' || echo "로그 없음")
          echo "msg=$MSG" >> $GITHUB_OUTPUT

      - name: Slack — 릴리즈 실패
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TAG: ${{ steps.tag.outputs.tag }}
          ERR_MSG: ${{ steps.errlog.outputs.msg }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD=$(jq -n \
            --arg tag "$TAG" \
            --arg err "${ERR_MSG:-에러 로그 없음}" \
            --arg url "$RUN_URL" \
            '{text:(":x: *Meeting Assistant 릴리즈 빌드 실패* ("+$tag+")"),
              attachments:[{color:"#e01e5a",fields:[
                {title:"태그",value:$tag,short:true},
                {title:"에러 요약",value:$err,short:false},
                {title:"전체 로그",value:("<"+$url+"|GitHub Actions에서 보기>"),short:false}
              ]}]}')
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' -d "$PAYLOAD"
