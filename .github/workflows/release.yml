name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get tag name
        id: tag
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" >> $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\nd975f751698a77b662f1254f32502067b88d9c80" >> $ANDROID_HOME/licenses/android-sdk-license

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Meeting Assistant ${{ steps.tag.outputs.tag_name }}"
          body: |
            ## Meeting Assistant ${{ steps.tag.outputs.tag_name }}

            ### 설치 방법
            1. 아래 APK 중 하나를 다운로드
            2. Android 기기에서 `설정 → 보안 → 알 수 없는 소스` 허용
            3. APK 파일 실행해서 설치

            ### APK 종류
            - `app-release.apk` — 범용 (모든 기기)
            - `app-arm64-v8a-release.apk` — 64비트 ARM (권장)

            ### 요구사항
            - Android 7.0 (API 24) 이상
          files: build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
          
      - name: Comment with download links
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.TAG_NAME;
            const repo = process.env.REPO;
            console.log(`✅ Release created: ${tag}`);
            console.log(`Download: https://github.com/${repo}/releases/tag/${tag}`);
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
          REPO: ${{ github.repository }}
