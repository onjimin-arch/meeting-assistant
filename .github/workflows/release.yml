name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '릴리즈 태그 (예: v2.2.0)'
        required: true
        type: string

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: flutter pub get
        run: flutter pub get

      - name: Patch plugin compileSdk
        run: |
          find "$HOME/.pub-cache" -name "build.gradle" | while read f; do
            sed -i \
              -e 's/compileSdkVersion [0-9]*/compileSdk 36/g' \
              -e 's/compileSdk [0-9][0-9]*/compileSdk 36/g' \
              -e 's/targetSdkVersion \([0-9]*\)/targetSdk \1/g' \
              -e 's/minSdkVersion \([0-9]*\)/minSdk \1/g' \
              "$f"
          done

      - name: Build Release APK
        id: build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_SECRET_API }}
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --dart-define=NOTION_TOKEN=$NOTION_TOKEN 2>&1 | tee build_output.txt
          echo "=== 생성된 APK ==="
          ls -lh build/app/outputs/flutter-apk/

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Meeting Assistant ${{ steps.tag.outputs.tag }}"
          fail_on_unmatched_files: true
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          body: |
            ## Meeting Assistant ${{ steps.tag.outputs.tag }}

            ### 설치 방법
            1. **`app-arm64-v8a-release.apk`** 다운로드 (갤럭시, 픽셀 등 최신 폰)
               - 구형 기기면 `app-armeabi-v7a-release.apk` 선택
            2. 폰에 파일 전송 (구글드라이브, 카톡 등)
            3. "알 수 없는 출처 앱 허용" 후 설치

            **최소 요구 사항**: Android 7.0 (API 24) 이상
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Slack — 릴리즈 성공
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          RELEASE_URL="https://github.com/onjimin-arch/meeting-assistant/releases/tag/$TAG"
          PAYLOAD=$(jq -n \
            --arg tag "$TAG" \
            --arg url "$RELEASE_URL" \
            '{attachments:[{color:"#36a64f",blocks:[
              {type:"section",text:{type:"mrkdwn",
              text:(":rocket: *Meeting Assistant "+$tag+" 릴리즈 완료!*\n\n<"+$url+"|:inbox_tray: APK 다운로드 ("+$tag+")>")}}
            ]}]}')
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' -d "$PAYLOAD"

      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-error-logs-${{ github.run_number }}
          path: build_output.txt
          retention-days: 7

      - name: Read error tail for Slack
        if: failure()
        id: errlog
        run: |
          MSG=$(tail -30 build_output.txt 2>/dev/null | tr '\n' ' ' | sed 's/"/\\"/g' || echo "로그 없음")
          echo "msg=$MSG" >> $GITHUB_OUTPUT

      - name: Slack — 릴리즈 실패
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TAG: ${{ steps.tag.outputs.tag }}
          ERR_MSG: ${{ steps.errlog.outputs.msg }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DISPATCH_URL: https://github.com/${{ github.repository }}/actions/workflows/release.yml
        run: |
          PAYLOAD=$(jq -n \
            --arg tag "$TAG" \
            --arg err "${ERR_MSG:-에러 로그 없음}" \
            --arg run_url "$RUN_URL" \
            --arg dispatch_url "$DISPATCH_URL" \
            '{attachments:[{color:"#e01e5a",blocks:[
              {type:"section",text:{type:"mrkdwn",
               text:(":x: *Meeting Assistant "+$tag+" 릴리즈 실패*\n\n```"+$err+"```\n\n<"+$run_url+"|전체 로그 보기>  |  <"+$dispatch_url+"|수동 재실행 (workflow_dispatch)>")}
              }
            ]}]}')
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' -d "$PAYLOAD"
