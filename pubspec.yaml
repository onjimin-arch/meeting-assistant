name: meeting_assistant
description: 온디바이스 AI 기반 회의 자동 기록 & Notion 저장 모바일 앱
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 상태 관리
  flutter_riverpod: ^2.5.1

  # STT: 플랫폼 내장 음성 인식
  speech_to_text: ^7.0.0

  # LLM: 온디바이스 Gemma 추론
  flutter_gemma: ^0.10.0

  # Notion API / 모델 다운로드
  http: ^1.2.1
  crypto: ^3.0.3

  # UI & 유틸
  intl: ^0.19.0
  uuid: ^4.4.0

  # 설정 저장
  shared_preferences: ^2.2.3

  # 권한 (마이크 등)
  permission_handler: ^11.3.1

  # 경로 (모델 캐시 위치 등)
  path_provider: ^2.1.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
