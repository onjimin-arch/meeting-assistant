name: meeting_assistant
description: 온디바이스 AI 기반 회의 자동 기록 & Notion 저장 모바일 앱
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 상태 관리
  flutter_riverpod: ^2.5.1

  # 오디오 녹음 (m4a 파일)
  record: ^5.2.0

  # STT: 플랫폼 내장 음성 인식 (레거시)
  speech_to_text: ^7.0.0

  # Notion API / 모델 다운로드
  http: ^1.2.1
  crypto: ^3.0.3

  # UI & 유틸
  intl: ^0.19.0
  uuid: ^4.4.0

  # 설정 저장
  shared_preferences: ^2.2.3

  # 권한 (마이크 등)
  permission_handler: ^11.3.1

  # 경로 (모델 캐시 위치 등)
  path_provider: ^2.1.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

# record_linux 0.7.2 가 startStream / hasPermission 최신 시그니처를 미구현.
# 로컬 스텁 패키지로 교체 — Android 빌드에서 record_linux 는 런타임에 사용되지 않음.
dependency_overrides:
  record_linux:
    path: packages/record_linux

flutter:
  uses-material-design: true
